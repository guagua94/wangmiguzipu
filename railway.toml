[build]
builder = "nixpacks"
watchPatterns = ["/apps/web/**", "/apps/web/dist/**"]
buildCommand = "cd apps/web && npm install && npx vite build --mode production && echo 'BUILD_TIMESTAMP=2026-09-05-10-00'"

[deploy]
startCommand = "cd apps/web && npm run preview"

